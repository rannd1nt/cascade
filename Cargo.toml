[workspace]
resolver = "2"
members = [
    "crates/cascade-core",
    "crates/cascade-win",
    "crates/cascade-media",
    "crates/cascade-ui",
    "crates/cascade",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.80"

[workspace.dependencies]
cascade-core = { path = "crates/cascade-core" }
cascade-win = { path = "crates/cascade-win" }
cascade-media = { path = "crates/cascade-media" }
cascade-ui = { path = "crates/cascade-ui" }
# First GUI framework. MIT OR Apache-2.0, no third-party GPL/LGPL
# (Cascade itself is GPL-3.0-only). The glow renderer and bundled fonts are
# used; the default wgpu/wayland/x11/accesskit/clipboard features are not.
# "persistence" restores the window size across launches into our own data
# directory, %APPDATA%\Cascade\data\app.ron.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "experimental"] }
# JPEG encode/decode for library thumbnails. Already in Cargo.lock via eframe
# (which enables only `png`); `jpeg` adds zune-core + zune-jpeg, both
# MIT OR Apache-2.0. Pure Rust, no GPL, and the daemon never calls it.
# `png` decodes the embedded GUI window icon and adds no new crate.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Settings persistence. MIT OR Apache-2.0, pure Rust (winnow parser) so it
# cross-compiles under cargo-xwin.
toml = "0.8"
windows = "0.62"
# Direct dependency only for the `#[implement]` macro, which emits
# `::windows_core::` paths; same version windows already pulls in.
windows-core = "0.62"
# One version for the pipe client (cascade-core) and the pipe server
# (cascade-win). MIT OR Apache-2.0.
windows-sys = "0.61"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
