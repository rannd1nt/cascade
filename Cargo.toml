[workspace]
resolver = "2"
members = [
    "crates/fontaine-core",
    "crates/fontaine-media",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
fontaine-core = { path = "crates/fontaine-core" }
fontaine-media = { path = "crates/fontaine-media" }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
