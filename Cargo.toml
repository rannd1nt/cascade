[workspace]
resolver = "2"
members = [
    "crates/cascade-core",
    "crates/cascade-win",
    "crates/cascade-media",
    "crates/cascade",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
cascade-core = { path = "crates/cascade-core" }
cascade-win = { path = "crates/cascade-win" }
cascade-media = { path = "crates/cascade-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
