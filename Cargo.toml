[workspace]
resolver = "2"
members = [
    "crates/cascade-core",
    "crates/cascade-win",
    "crates/cascade-media",
    "crates/cascade",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
cascade-core = { path = "crates/cascade-core" }
cascade-win = { path = "crates/cascade-win" }
cascade-media = { path = "crates/cascade-media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# config.toml (architecture §10): settings persistence. MIT OR Apache-2.0,
# pure Rust (winnow parser) so it cross-compiles under cargo-xwin.
toml = "0.8"
windows = "0.62"
# Direct dependency only for the `#[implement]` macro, which emits
# `::windows_core::` paths; same version windows already pulls in.
windows-core = "0.62"
# One version for the pipe client (cascade-core, design-m5 D10) and the
# pipe server (cascade-win). MIT OR Apache-2.0 (AGENTS §11).
windows-sys = "0.61"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
