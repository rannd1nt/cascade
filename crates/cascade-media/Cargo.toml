[package]
name = "cascade-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cascade-core = { workspace = true }
# JPEG encode/decode for the thumbnail cache (first frame → RGB → JPEG).
# MIT OR Apache-2.0; called by cascade-ui only — the daemon never links a
# decode call path.
image = { workspace = true }
# Media Foundation COM bindings; windows-sys ships no MF APIs.
# License MIT OR Apache-2.0, same as the rest of the workspace.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    # SourceReader backend: D3D11 device + NV12 textures, DXGI swapchain.
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
# Only for `#[implement(IMFMediaEngineNotify)]`, which expands to
# `::windows_core::` paths (the windows crate is a facade).
windows-core = { workspace = true }
