[package]
name = "cascade-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cascade-core = { workspace = true }
# Media Foundation COM bindings (design-m2 §2.3): windows-sys ships no MF
# APIs. License MIT OR Apache-2.0, same as the rest of the workspace.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # PROPVARIANT (IMFMediaEngineEx::GetStatistics) and its VARENUM.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
# Only for `#[implement(IMFMediaEngineNotify)]`, which expands to
# `::windows_core::` paths (the windows crate is a facade).
windows-core = { workspace = true }
