[package]
name = "cascade"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
# Lowercase `cascade` (7-char stem): see AGENTS.md §3.14 — stems of 6 or
# 8 characters trigger the unexplained address-space allocation on
# build 26200.9711. Both `Cascade` and `cascade` were re-measured as cold
# 7-char classes (docs/spike-m0.md §10.5–§10.6 and the revert note there).
# Renaming requires a re-measure first.
name = "cascade"
path = "src/main.rs"

[dependencies]
cascade-core = { workspace = true }
cascade-win = { workspace = true }
cascade-media = { workspace = true }
# `cascade ui` (design-m5 P2): the GUI client, a separate process that
# depends only on core (+ its own eframe/windows) — AGENTS §4.
cascade-ui = { workspace = true }
# `cascade status --json` prints the daemon's payload as-is (design-m4 §3).
serde_json = { workspace = true }
