[package]
name = "cascade"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
# Lowercase `cascade` (7-char stem): stems of 6 or 8 characters trigger the
# unexplained address-space allocation on build 26200.9711. Both `Cascade`
# and `cascade` were re-measured as cold 7-char classes. Renaming requires
# a re-measure first; the measurements are in the local notes.
name = "cascade"
path = "src/main.rs"

[dependencies]
cascade-core = { workspace = true }
cascade-win = { workspace = true }
cascade-media = { workspace = true }
# `cascade ui` is the GUI client, a separate process that depends only on
# core (+ its own eframe/windows).
cascade-ui = { workspace = true }
# `cascade status --json` prints the daemon's payload as-is.
serde_json = { workspace = true }
