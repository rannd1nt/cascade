[package]
name = "cascade-win"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cascade-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# config.toml persistence.
toml = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    # Tray icon: Shell_NotifyIcon on the control window.
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    # Named-pipe server/client + process counters for the `status` payload.
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    # Power collector: RegisterPowerSettingNotification + GetSystemPowerStatus
    # (Power) and GUID_ACDC_POWER_SOURCE (SystemServices).
    "Win32_System_Power",
    "Win32_System_SystemServices",
    # CreateFileW / CreateNamedPipeW are cfg-gated on this feature in
    # windows-sys 0.61 (their signatures take SECURITY_ATTRIBUTES).
    "Win32_Security",
    # Raw CoInitializeEx HRESULT, so a successful S_FALSE is not mistaken for
    # an apartment we own and must release.
    "Win32_System_Com",
] }
# `windows-sys` no longer ships the D3D11/DXGI (nor Media Foundation) bindings,
# and the renderer needs COM interfaces with vtable dispatch. The two crates
# coexist: `windows-sys` for the flat Win32 calls, `windows` for graphics.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # `IDXGIOutput6::GetDesc1` is cfg-gated on Common + Gdi (the desc carries
    # an HMONITOR).
    "Win32_Graphics_Gdi",
    # Hardware-MFT enumeration for decode capability (windows-sys ships no MF
    # APIs) plus the COM apartment MFTEnumEx needs on the calling thread.
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # IShellLinkW + IPersistFile, FOLDERID_{Programs, Desktop},
    # SHGetKnownFolderPath and SHChangeNotify for the per-user shortcuts.
    "Win32_UI_Shell",
] }
