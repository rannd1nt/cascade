[package]
name = "cascade-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
# eframe 0.37's MSRV outranks the workspace's 1.80.
rust-version = "1.95"

[dependencies]
cascade-core = { workspace = true }
# Thumbnails decode in the UI process only; the UI is the sole caller of
# cascade-media::thumbnail.
cascade-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The GUI framework (glow renderer + bundled fonts).
eframe = { workspace = true }
# Decode the embedded cascade-256.png into egui's IconData for the
# window/taskbar icon. UI-process only; no new crate.
image = { workspace = true }
# IFileOpenDialog straight from the workspace's windows crate — no rfd, no
# custom file browser.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    # GetActiveWindow: dialog owner (lives in Input, not Messaging).
    "Win32_UI_Input_KeyboardAndMouse",
] }
